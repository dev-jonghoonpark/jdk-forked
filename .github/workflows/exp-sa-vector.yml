# EXPERIMENT ONLY - not for upstream.
# Builds fastdebug on x64 platforms and runs only TestVectorDebugInfoDecode,
# to see which vector species end up as Location::vector on real x64 hardware.

name: 'Experiment: SA vector locations on x64'

on:
  push:
    branches:
      - exp/sa-vector-x64
  workflow_dispatch:

jobs:
  jtreg:
    name: 'Build JTReg'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-linux-x64:
    name: linux-x64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '10'
      debug-levels: '[ "debug" ]'

  build-linux-aarch64:
    name: linux-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-24.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '14'
      debug-levels: '[ "debug" ]'

  test-linux-aarch64:
    name: linux-aarch64
    needs: build-linux-aarch64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: linux-aarch64
      bootjdk-platform: linux-aarch64
      runs-on: ubuntu-24.04-arm
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java

  build-windows-x64:
    name: windows-x64
    needs: jtreg
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-x64
      runs-on: windows-2022
      architecture: 'x86.x64'
      msvc-toolset-version: '14.44'
      debug-levels: '[ "debug" ]'

  test-linux-x64:
    name: linux-x64
    needs: build-linux-x64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: linux-x64
      bootjdk-platform: linux-x64
      runs-on: ubuntu-24.04
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java

  test-windows-x64:
    name: windows-x64
    needs: build-windows-x64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2022
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java

  build-windows-aarch64:
    name: windows-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-aarch64
      runs-on: windows-11-arm
      architecture: 'ARM64'
      msvc-toolset-version: '14.51'
      debug-levels: '[ "debug" ]'

  test-windows-aarch64:
    name: windows-aarch64
    needs: build-windows-aarch64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: windows-aarch64
      bootjdk-platform: windows-aarch64
      architecture: 'ARM64'
      runs-on: windows-11-arm
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java

  build-macos-aarch64:
    name: macos-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-macos.yml
    with:
      platform: macos-aarch64
      runs-on: 'macos-15'
      xcode-toolset-version: '16.4'
      debug-levels: '[ "debug" ]'

  test-macos-aarch64:
    name: macos-aarch64
    needs: build-macos-aarch64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: macos-aarch64
      bootjdk-platform: macos-aarch64
      runs-on: macos-15
      xcode-toolset-version: '16.4'
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java

  build-macos-x64:
    name: macos-x64
    needs: jtreg
    uses: ./.github/workflows/build-macos.yml
    with:
      platform: macos-x64
      runs-on: 'macos-15-intel'
      xcode-toolset-version: '16.4'
      configure-arguments: --enable-deprecated-ports
      debug-levels: '[ "debug" ]'

  test-macos-x64:
    name: macos-x64
    needs: build-macos-x64
    uses: ./.github/workflows/exp-test-single.yml
    with:
      platform: macos-x64
      bootjdk-platform: macos-x64
      runs-on: macos-15-intel
      xcode-toolset-version: '16.4'
      debug-suffix: -debug
      test-suite: test/hotspot/jtreg/serviceability/sa/TestVectorDebugInfoDecode.java
